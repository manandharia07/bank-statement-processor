# ---------------------------------------------------------------------------
# Transaction categories and keyword rules (heuristic layer of the classifier)
#
# * `categories` : every category and the money direction it allows
#                  (debit / credit / any). The ML layer also respects this,
#                  e.g. a CREDIT can never be predicted as "Food & Dining".
# * `rules`      : checked TOP TO BOTTOM, first match wins, so put specific
#                  rules (refunds, credit-card bills) above generic ones.
#     keywords   : whole-word match after normalisation (case-insensitive,
#                  '/', '-', '@', '.' treated as spaces). Keywords of 6+
#                  letters also match inside joined text (e.g. "zomato12@ybl").
#     patterns   : optional regular expressions on the normalised text.
#     direction  : optional - rule only applies to debits or credits.
#
# Adding a category or keyword needs NO code change - edit this file.
# ---------------------------------------------------------------------------
categories:
  Food & Dining: debit
  Groceries: debit
  Shopping: debit
  Travel & Transport: debit
  Fuel: debit
  Utilities & Bills: debit
  Rent: debit
  EMI & Loans: debit
  Credit Card Payment: debit
  Insurance: debit
  Investments: debit
  Healthcare: debit
  Education: debit
  Entertainment & Subscriptions: debit
  Cash Withdrawal: debit
  Bank Charges: debit
  Taxes: debit
  Transfer Out: debit
  Salary: credit
  Interest & Dividends: credit
  Refunds & Cashback: credit
  Cash Deposit: credit
  Transfer In: credit
  Uncategorized: any

rules:
  - category: Refunds & Cashback
    direction: credit
    keywords: [REFUND, CASHBACK, REVERSAL, CHARGES REVERSAL, REV UPI, REVERSED]
    patterns: ['^REV\b']

  - category: Salary
    direction: credit
    keywords: [SALARY, SAL, PAYROLL, SALARY CREDIT, STIPEND]

  - category: Interest & Dividends
    direction: credit
    keywords: [INTEREST, INT PD, SB INT, CREDIT INTEREST, DIVIDEND, DIV, INTEREST CAPITALISED, CAPITALISED]

  - category: Cash Deposit
    direction: credit
    keywords: [CASH DEPOSIT, CASH DEP, BY CASH, CDM DEPOSIT, CDM]

  - category: Bank Charges
    direction: debit
    keywords: [CHARGES, CHARGE, CHGS, CHRGS, ANNUAL FEE, AMC, MIN BAL, NON MAINTENANCE, SMS ALERT,
               DEBIT CARD FEE, SERVICE CHARGES, CHQ BOOK, PENAL]

  - category: Taxes
    direction: debit
    keywords: [INCOME TAX, ADVANCE TAX, TDS, GST PAYMENT, PROFESSIONAL TAX, CBDT, ITNS280, ITNS, SELF ASSESSMENT TAX,
               PROPERTY TAX, TAX PAYMENT, CHALLAN]

  - category: Credit Card Payment
    direction: debit
    keywords: [CREDIT CARD, CC PAYMENT, CC BILL, CRED CLUB, CARD BILL, BILLPAY DR, CCPAY, CC AUTOPAY]

  - category: Cash Withdrawal
    direction: debit
    keywords: [ATM WDL, ATM CASH, NWD, ATW, CASH WDL, CASH WITHDRAWAL, ATM WITHDRAWAL, SELF]
    patterns: ['^ATM\b']

  - category: Rent
    direction: debit
    keywords: [RENT, HOUSE RENT, NOBROKER RENT, CRED RENT]

  - category: Insurance
    direction: debit
    keywords: [INSURANCE, PREMIUM, LIC OF INDIA, HDFC LIFE, ICICI PRULIFE, SBI LIFE, MAX LIFE, STAR HEALTH,
               POLICYBAZAAR, BAJAJ ALLIANZ, TATA AIG, NIVA BUPA, ACKO, DIGIT INSURANCE]

  - category: Investments
    direction: debit
    keywords: [SIP, MUTUAL FUND, MF, ZERODHA, GROWW, UPSTOX, ANGEL ONE, KUVERA, PAYTM MONEY, BSE LIMITED,
               INDIAN CLEARING CORP, PPF, RD INSTALLMENT, FD BOOKED, NPS TRUST, ICICI SECURITIES, NIPPON INDIA]

  - category: EMI & Loans
    direction: debit
    keywords: [EMI, LOAN, LOAN RECOVERY, BAJAJ FINANCE, HOME CREDIT, TATA CAPITAL, MUTHOOT FINANCE,
               LIC HOUSING FINANCE, FULLERTON, MAHINDRA FINANCE, HDFC LTD]

  - category: Groceries
