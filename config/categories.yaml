               NATURES BASKET, GROFERS, STAR BAZAAR, INSTAMART, DUNZO, SUPERMARKET, GROCERY, KIRANA]

  - category: Food & Dining
    direction: debit
    keywords: [SWIGGY, ZOMATO, DOMINOS, MCDONALDS, KFC, STARBUCKS, HALDIRAMS, BARBEQUE NATION, CAFE COFFEE DAY,
               BURGER KING, PIZZA HUT, CHAAYOS, BEHROUZ, FAASOS, SUBWAY, RESTAURANT, CAFE, BIRYANI, EATSURE,
               THEOBROMA, BAKERY, FOODS, DHABA]

  - category: Fuel
